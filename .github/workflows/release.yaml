name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    uses: ardubev16/common/.github/workflows/docker-build.yaml@5d99c78f2b99d5a2bc79657e36582da84740f86d # main
    with:
      tags: type=ref,event=tag

  release:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
